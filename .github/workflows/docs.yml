name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Needed by deploy-pages to publish the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: the site would be left
# serving whatever the interrupted run had uploaded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field in docs/package.json,
      # so CI and a local install resolve the same one.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The store lives inside node_modules, see docs/pnpm-workspace.yaml. Restoring it
      # before install is what makes the install fast; it is not useful afterwards.
      - uses: actions/cache@v4
        with:
          path: docs/node_modules/.pnpm-store
          key: pnpm-store-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - run: pnpm install --frozen-lockfile

      # Fails on broken internal links, so a bad cross reference cannot reach the site.
      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  # Pull requests build only. Nothing is published until the change is on main.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
